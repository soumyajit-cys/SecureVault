# Render Blueprint — SecureVault backend (FastAPI + Postgres + Redis)
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Free tier: web service sleeps after 15 min idle (cold start ~1 min).
# Free-tier caveats:
#   - Filesystem is ephemeral: uploaded vault files are LOST on redeploy/restart.
#     Either use the paid "Persistent Disk" (mount at /app/storage) with
#     STORAGE_BACKEND=local, or — free — use Backblaze B2 object storage
#     with STORAGE_BACKEND=s3 (see S3_* vars below; docs/deployment.md).
#   - Use Neon (free Postgres) instead of Render's free Postgres (auto-deleted after 90 days).
#   - Use Upstash (free Redis) for REDIS_URL; Render has no free managed Redis.
services:
  - type: web
    name: securevault-api
    runtime: docker
    repo: https://github.com/YOUR_USERNAME/SecureVault
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: CHANGEME-generate-32-plus-random-chars # set a random 32+ char value in the dashboard
      - key: DATABASE_URL
        sync: CHANGEME-postgresql-plus-psycopg-url # postgresql+psycopg://user:pass@neon-host/securevault
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: REDIS_URL
        sync: CHANGEME-redis-url # redis://...@upstash-host:6379 (free tier)
      - key: CORS_ALLOW_ORIGINS
        value: '["https://YOUR-APP.vercel.app"]'
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: PWNED_CHECK_ENABLED
        value: "true"
      - key: ENABLE_SECURITY_HEADERS
        value: "true"
      - key: VAULT_ADMIN_EMAIL
        value: admin@example.com
      - key: VAULT_ADMIN_USERNAME
        value: admin
      - key: VAULT_ADMIN_PASSWORD
        sync: CHANGEME-strong-admin-password # set a strong password in the dashboard
      - key: STORAGE_DIR
        value: /app/storage
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false    # e.g. https://s3.us-west-004.backblazeb2.com (B2 bucket region)
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false    # B2 application key ID (bucket-scoped, not master key)
      - key: S3_SECRET_KEY
        sync: false    # B2 application key secret
      - key: S3_REGION
        value: us-west-004
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "52428800"    # 50 MB — stays under Render free-tier limits
