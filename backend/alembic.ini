[alembic]
script_location = alembic

# NOTE: no credentials live here on purpose. backend/alembic/env.py
# overrides sqlalchemy.url from DATABASE_URL at runtime (offline and
# online modes). Keep this value credential-free.
sqlalchemy.url = postgresql+psycopg://localhost:5432/securevault

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S