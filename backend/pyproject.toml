[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securevault-backend"
version = "1.0.0"
description = "Enterprise-grade, zero-knowledge encrypted vault backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.38.0",
    "python-multipart==0.0.22",
    "sqlalchemy==2.0.45",
    "psycopg[binary]==3.3.3",
    "alembic==1.18.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.0",
    "email-validator>=2.2.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==25.1.0",
    "PyJWT==2.11.0",
    "cryptography==46.0.6",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "pyotp==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
