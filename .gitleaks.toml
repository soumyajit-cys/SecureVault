# Gitleaks config: default rules, plus an allowlist for documentation
# example placeholders like <b2-application-key-id>. Real secrets in
# docs/ (no angle brackets) are still flagged.
title = "SecureVault gitleaks config"

[[rules]]
description = "Render blueprint 'sync:' line carrying a value instead of 'false' (dashboard prompt). Values shorter than 8 chars (e.g. 'false') never match; CHANGEME placeholders are exempt in [allowlist]."
id = "render-sync-secret"
regex = '''(?i)^\s*sync:\s*['"]?[A-Za-z0-9_+\/=:.@~$-]{8,}'''

[allowlist]
description = "Angle-bracket placeholders in docs/examples, plus the CHANGEME placeholder convention used in deploy templates"
paths = ['''docs/.*''', '''.*\.example$''']
regexes = ['''<[A-Za-z0-9_.:/-]+>''', '''CHANGEME''']
